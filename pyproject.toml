[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "facial-phenotype-analysis"
version = "0.1.0"
description = "Statistical evaluation of binary facial phenotype classifiers"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
plots = ["matplotlib>=3.8,<4"]

[project.scripts]
facial-analysis = "facial_analysis.cli:main"

[tool.setuptools.packages.find]
include = ["facial_analysis*"]
